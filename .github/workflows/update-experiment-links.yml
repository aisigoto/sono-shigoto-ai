name: Validate revenue project navigation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-experiment-links.yml"
      - "*.html"
      - "sitemap.xml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check independent project navigation
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          hub = "ai-revenue.html"
          report = "ai-revenue-experiment-01.html"
          assert Path(hub).is_file()
          assert Path(report).is_file()

          class HeaderLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_header = False
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "header":
                      self.in_header = True
                  if tag == "a" and self.in_header:
                      self.links.append(dict(attrs).get("href"))
              def handle_endtag(self, tag):
                  if tag == "header":
                      self.in_header = False

          for page in Path(".").glob("*.html"):
              html = page.read_text(encoding="utf-8")
              parser = HeaderLinks()
              parser.feed(html)
              assert hub in parser.links, f"{page}: project navigation missing"

          for name in ("ai-sales-email.html", "ai-meeting-tools.html"):
              html = Path(name).read_text(encoding="utf-8")
              assert f'href="{report}"' not in html, f"{name}: unrelated report teaser returned"

          root = ET.parse("sitemap.xml").getroot()
          urls = {node.text for node in root.iter() if node.tag.endswith("}loc") or node.tag == "loc"}
          assert f"https://sono-shigoto-ai.com/{hub}" in urls
          assert f"https://sono-shigoto-ai.com/{report}" in urls
          print("Independent revenue project navigation verified; no site files changed.")
