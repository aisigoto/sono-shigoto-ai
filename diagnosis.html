<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI仕事診断｜その仕事、AIにできる？</title>
<meta name="description" content="5問で、あなたが最初にAI化を検討しやすい仕事のタイプを診断します。">
<link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site-header"><div class="container nav"><a class="logo" href="index.html">その仕事、<span>AIにできる？</span></a><nav><a href="index.html#works">仕事から探す</a><a href="article-ai-efficiency.html">読み物</a></nav></div></header>
<main class="diagnosis">
<p class="eyebrow">FREE AI WORK DIAGNOSIS</p>
<h1>あなたの仕事、<br>どこからAI化する？</h1>
<p class="lead">5問に答えると、最初に見直しやすい仕事のタイプを表示します。</p>
<form id="quiz">
<div class="question-card"><b>Q1. 一番時間を取られているのは？</b>
<label><input name="q1" value="文章" type="radio" required>メール・文章</label>
<label><input name="q1" value="会議" type="radio">会議・打ち合わせ</label>
<label><input name="q1" value="営業" type="radio">営業・顧客対応</label>
<label><input name="q1" value="事務" type="radio">事務・情報整理</label></div>
<div class="question-card"><b>Q2. 同じ作業を繰り返すことが多い？</b>
<label><input name="q2" value="yes" type="radio" required>かなり多い</label><label><input name="q2" value="no" type="radio">あまりない</label></div>
<div class="question-card"><b>Q3. 作業の手順は決まっている？</b>
<label><input name="q3" value="yes" type="radio" required>ある程度決まっている</label><label><input name="q3" value="no" type="radio">毎回違う</label></div>
<div class="question-card"><b>Q4. AIの出力を最後に自分で確認できる？</b>
<label><input name="q4" value="yes" type="radio" required>確認できる</label><label><input name="q4" value="no" type="radio">難しい</label></div>
<div class="question-card"><b>Q5. 一番減らしたいのは？</b>
<label><input name="q5" value="time" type="radio" required>作業時間</label><label><input name="q5" value="thinking" type="radio">考える負担</label><label><input name="q5" value="mistake" type="radio">抜け漏れ</label></div>
<button class="button primary" type="submit">診断する</button>
</form>
<div id="result" class="result"></div>
</main>
<script>
document.getElementById('quiz').addEventListener('submit',e=>{
 e.preventDefault();
 const data=new FormData(e.target), type=data.get('q1'), repeat=data.get('q2')==='yes', review=data.get('q4')==='yes';
 let title,body;
 if(type==='文章') {title='メール・文章からAI化';body='定型メール、返信、文章の下書きから始めるのがおすすめです。目的・相手・要点を渡して下書きを作り、最後は人が確認する形が始めやすいです。';}
 else if(type==='会議'){title='会議・議事録からAI化';body='文字起こし、要約、決定事項、アクション整理を候補にしてください。重要事項は原文と照合しましょう。';}
 else if(type==='営業'){title='営業の周辺業務からAI化';body='商談後のフォロー、顧客情報整理、提案のたたき台など、定型的な周辺業務から検討すると始めやすいです。';}
 else {title='事務・情報整理からAI化';body='情報の分類、要約、比較表づくりなど、ルールが明確で確認できる作業から検討してください。';}
 if(!repeat) body+=' まずは「毎週繰り返す作業」を1つ見つけるところから始めましょう。';
 if(!review) body+=' なお、重要な判断や高リスクな情報はAIだけで確定せず、人による確認を前提にしてください。';
 const r=document.getElementById('result');r.innerHTML='<h2>'+title+'</h2><p>'+body+'</p><p><a class="text-link" href="article-ai-efficiency.html">→ AI化の基本を読む</a></p>';r.classList.add('show');r.scrollIntoView({behavior:'smooth'});
});
</script>
</body></html>
